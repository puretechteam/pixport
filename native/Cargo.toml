[package]
name = "pixport-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pure Tech"]
description = "Compiled decoders for pixport (optional, except for JPEG XL)"
publish = false

[lib]
name = "pixport_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
libdeflater = "=1.26.1"

# libjxl (JPEG XL), built from the source in jpegxl-src by build.rs
[build-dependencies]
cmake = "0.1.58"
jpegxl-src = "=0.12.0"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# no symbol tables in the Linux and macOS wheels (Windows keeps them in a .pdb that isn't shipped)
strip = true
