name: native

# pixport-native's wheels: built for every push and pull request (and checked against the
# Python decoders), and attached to the GitHub release when a version tag is pushed.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # manylinux2014's ARM cross compiler is gcc 4.8, too old for libdeflate's ARM code
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # build.rs compiles libjxl (JPEG XL) from source: CMake and a C++17 compiler. The runners
      # have both; the manylinux containers get CMake from pip if theirs is missing. macOS 10.15
      # is the oldest whose C++ library has what libjxl uses.
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          working-directory: native
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: |
            command -v cmake > /dev/null 2>&1 || python3 -m pip install "cmake>=3.16"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: native/dist/*.whl

  check:
    needs: wheels
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --no-index --find-links wheels pixport-native
      - name: the tests, with the compiled decoders
        run: python -m pytest -q
      - name: the tests, with NumPy only
        run: python -m pytest -q
        env:
          PIXPORT_PURE: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --release --manifest-path native/Cargo.toml --no-default-features

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, check, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      # a tag alone has no release to attach files to: make one first if the tag doesn't have it yet
      - name: attach the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "pixport ${GITHUB_REF_NAME#v}" \
              --notes "What changed: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          gh release upload "${GITHUB_REF_NAME}" wheels/*.whl --clobber --repo "${GITHUB_REPOSITORY}"
